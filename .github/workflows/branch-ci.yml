name: Ma Lecture branch CI

on:
  push:
    branches: [ma-lecture-v0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Materialize corpus and PWA icons
        run: |
          npm run import:corpus
          npm run generate:icons
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Commit reproducible generated assets
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/data/quran-fr.json public/data/SOURCE.md public/icons/icon-192.png public/icons/icon-512.png public/icons/icon-maskable-512.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: materialize Ma Lecture corpus and icons"
          git push origin HEAD:ma-lecture-v0
